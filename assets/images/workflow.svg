<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Phase Step Card Gradient -->
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="glowEffect" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="500" rx="16" fill="url(#flowBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Grid overlay -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="1">
    <pattern id="wgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" />
    </pattern>
    <rect width="1200" height="500" fill="url(#wgrid)" />
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" class="font-sans" font-size="26" font-weight="800" fill="#f8fafc">
      The 6-Phase Verbatim Splitting Architecture
    </text>
    <text x="0" y="24" class="font-sans" font-size="14" fill="#94a3b8">
      A deterministic, zero-hallucination refactoring protocol designed for Autonomous AI Agents and Senior Engineers
    </text>
  </g>

  <!-- ================= TOP ROW: PHASES 1 -> 3 ================= -->
  <!-- Phase 1 -->
  <g transform="translate(60, 100)" filter="url(#glowEffect)">
    <rect width="320" height="150" rx="10" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="28" cy="28" r="14" fill="#0284c7" fill-opacity="0.2" />
    <text x="23" y="33" class="font-mono" font-size="14" font-weight="800" fill="#38bdf8">1</text>
    <text x="52" y="32" class="font-sans" font-size="15" font-weight="700" fill="#f1f5f9">SURVEY &amp; BOUNDARY</text>
    
    <text x="24" y="65" class="font-sans" font-size="12" fill="#94a3b8">Polyglot AST / Indentation Scanner</text>
    <rect x="24" y="76" width="272" height="26" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="32" y="93" class="font-mono" font-size="10.5" fill="#38bdf8">survey &lt;file&gt; --json</text>
    <text x="24" y="125" class="font-sans" font-size="11" fill="#64748b">Calculates startLine, endLine &amp; symbol map</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 385 175 L 435 175" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="438,175 430,170 430,180" fill="#818cf8" />

  <!-- Phase 2 -->
  <g transform="translate(440, 100)" filter="url(#glowEffect)">
    <rect width="320" height="150" rx="10" fill="url(#stepGrad)" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="28" cy="28" r="14" fill="#4f46e5" fill-opacity="0.2" />
    <text x="23" y="33" class="font-mono" font-size="14" font-weight="800" fill="#818cf8">2</text>
    <text x="52" y="32" class="font-sans" font-size="15" font-weight="700" fill="#f1f5f9">BLUEPRINT &amp; SEAM</text>
    
    <text x="24" y="65" class="font-sans" font-size="12" fill="#94a3b8">Language-Native Seam Architecture</text>
    <g transform="translate(24, 76)">
      <rect width="70" height="20" rx="3" fill="#312e81" />
      <text x="8" y="14" class="font-mono" font-size="9" fill="#c7d2fe">Proxy Seam</text>
      <rect x="76" y="0" width="80" height="20" rx="3" fill="#312e81" />
      <text x="84" y="14" class="font-mono" font-size="9" fill="#c7d2fe">Partial Class</text>
      <rect x="162" y="0" width="80" height="20" rx="3" fill="#312e81" />
      <text x="170" y="14" class="font-mono" font-size="9" fill="#c7d2fe">Go Package</text>
    </g>
    <text x="24" y="125" class="font-sans" font-size="11" fill="#64748b">Zero-glue delegation between coordinator &amp; units</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 765 175 L 815 175" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="818,175 810,170 810,180" fill="#818cf8" />

  <!-- Phase 3 -->
  <g transform="translate(820, 100)" filter="url(#glowEffect)">
    <rect width="320" height="150" rx="10" fill="url(#stepGrad)" stroke="#c084fc" stroke-width="1.2" />
    <circle cx="28" cy="28" r="14" fill="#9333ea" fill-opacity="0.2" />
    <text x="23" y="33" class="font-mono" font-size="14" font-weight="800" fill="#c084fc">3</text>
    <text x="52" y="32" class="font-sans" font-size="15" font-weight="700" fill="#f1f5f9">IMMUTABLE BACKUP</text>
    
    <text x="24" y="65" class="font-sans" font-size="12" fill="#94a3b8">Snapshot Baseline &amp; SHA-256 Checksum</text>
    <rect x="24" y="76" width="272" height="26" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="32" y="93" class="font-mono" font-size="10.5" fill="#c084fc">backup &lt;file&gt; --checksum</text>
    <text x="24" y="125" class="font-sans" font-size="11" fill="#64748b">Guarantees 100% rollback safety on abort</text>
  </g>

  <!-- Down & Return Connector (Phase 3 -> Phase 4) -->
  <path d="M 980 255 L 980 285 L 980 285 L 980 305" stroke="#c084fc" stroke-width="2" />
  <polygon points="980,312 975,302 985,302" fill="#c084fc" />

  <!-- ================= BOTTOM ROW: PHASES 4 -> 6 (RIGHT TO LEFT) ================= -->
  <!-- Phase 4 -->
  <g transform="translate(820, 315)" filter="url(#glowEffect)">
    <rect width="320" height="150" rx="10" fill="url(#stepGrad)" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="28" cy="28" r="14" fill="#d97706" fill-opacity="0.2" />
    <text x="23" y="33" class="font-mono" font-size="14" font-weight="800" fill="#f59e0b">4</text>
    <text x="52" y="32" class="font-sans" font-size="15" font-weight="700" fill="#f1f5f9">VERBATIM SLICE</text>
    
    <text x="24" y="65" class="font-sans" font-size="12" fill="#94a3b8">Multi-Range Byte Extractor</text>
    <rect x="24" y="76" width="272" height="26" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="32" y="93" class="font-mono" font-size="10.5" fill="#f59e0b">slice &lt;bak&gt; 20-80,120-190 &lt;out&gt;</text>
    <text x="24" y="125" class="font-sans" font-size="11" fill="#64748b">Preserves byte-exact AST without LLM rewrite</text>
  </g>

  <!-- Connector 4 -> 5 -->
  <path d="M 815 390 L 765 390" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="760,390 768,385 768,395" fill="#10b981" />

  <!-- Phase 5 -->
  <g transform="translate(440, 315)" filter="url(#glowEffect)">
    <rect width="320" height="150" rx="10" fill="url(#stepGrad)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#059669" fill-opacity="0.2" />
    <text x="23" y="33" class="font-mono" font-size="14" font-weight="800" fill="#10b981">5</text>
    <text x="52" y="32" class="font-sans" font-size="15" font-weight="700" fill="#f1f5f9">4-AXIS PARITY GATE</text>
    
    <text x="24" y="65" class="font-sans" font-size="12" fill="#94a3b8">Symbols • DOM IDs • Events • Calls</text>
    <rect x="24" y="76" width="272" height="26" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="32" y="93" class="font-mono" font-size="10.5" fill="#10b981">verify-parity &lt;src&gt; &lt;targets...&gt;</text>
    <text x="24" y="125" class="font-sans" font-size="11" fill="#34d399">Blocks 100% of regressions before deploy</text>
  </g>

  <!-- Connector 5 -> 6 -->
  <path d="M 435 390 L 385 390" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="380,390 388,385 388,395" fill="#22d3ee" />

  <!-- Phase 6 -->
  <g transform="translate(60, 315)" filter="url(#glowEffect)">
    <rect width="320" height="150" rx="10" fill="url(#stepGrad)" stroke="#22d3ee" stroke-width="1.2" />
    <circle cx="28" cy="28" r="14" fill="#0891b2" fill-opacity="0.2" />
    <text x="23" y="33" class="font-mono" font-size="14" font-weight="800" fill="#22d3ee">6</text>
    <text x="52" y="32" class="font-sans" font-size="15" font-weight="700" fill="#f1f5f9">COORDINATOR SLIM &amp; CLEANUP</text>
    
    <text x="24" y="65" class="font-sans" font-size="12" fill="#94a3b8">Bottom-Up Replace &amp; Backup Safety</text>
    <rect x="24" y="76" width="272" height="26" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="32" y="93" class="font-mono" font-size="10.5" fill="#22d3ee">replace-range &lt;file&gt; start end</text>
    <text x="24" y="125" class="font-sans" font-size="11" fill="#64748b">Asks user consent before deleting .bak backups</text>
  </g>
</svg>
