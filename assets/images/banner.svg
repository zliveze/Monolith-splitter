<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a0f" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowViolet" cx="80%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="sliceLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1280" height="460" rx="16" fill="url(#bgGrad)" />
  <rect width="1280" height="460" rx="16" fill="url(#glowCyan)" />
  <rect width="1280" height="460" rx="16" fill="url(#glowViolet)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1280" height="460" fill="url(#grid)" />
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1278" height="458" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- ================= LEFT CONTENT: BRAND & TITLES ================= -->
  <g transform="translate(70, 75)">
    <!-- Version & Agent Readiness Pill -->
    <g>
      <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="15" r="4" fill="#22c55e" />
      <text x="30" y="19" class="font-mono" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1.5">PRODUCTION READY v2.1</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" class="font-sans" font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">
      MONOLITH SPLITTER
    </text>

    <!-- Subtitle -->
    <text x="2" y="125" class="font-sans" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Universal Polyglot Refactoring Skill &amp; Zero-Dependency CLI
    </text>

    <text x="2" y="152" class="font-sans" font-size="15" font-weight="400" fill="#64748b">
      Surgically slice 1,000–10,000+ line monoliths with Verbatim AST &amp; 4-Axis Parity Gate
    </text>

    <!-- Language Badges Row -->
    <g transform="translate(0, 195)">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <rect width="84" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <circle cx="14" cy="14" r="3.5" fill="#38bdf8" />
        <text x="26" y="18" class="font-mono" font-size="11" font-weight="600" fill="#cbd5e1">Python</text>
      </g>
      <!-- Java -->
      <g transform="translate(94, 0)">
        <rect width="72" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <circle cx="14" cy="14" r="3.5" fill="#f97316" />
        <text x="26" y="18" class="font-mono" font-size="11" font-weight="600" fill="#cbd5e1">Java</text>
      </g>
      <!-- C# .NET -->
      <g transform="translate(176, 0)">
        <rect width="82" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <circle cx="14" cy="14" r="3.5" fill="#a855f7" />
        <text x="26" y="18" class="font-mono" font-size="11" font-weight="600" fill="#cbd5e1">C# .NET</text>
      </g>
      <!-- Go -->
      <g transform="translate(268, 0)">
        <rect width="60" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <circle cx="14" cy="14" r="3.5" fill="#00add8" />
        <text x="25" y="18" class="font-mono" font-size="11" font-weight="600" fill="#cbd5e1">Go</text>
      </g>
      <!-- Rust -->
      <g transform="translate(338, 0)">
        <rect width="70" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <circle cx="14" cy="14" r="3.5" fill="#ef4444" />
        <text x="25" y="18" class="font-mono" font-size="11" font-weight="600" fill="#cbd5e1">Rust</text>
      </g>
      <!-- TS / JS -->
      <g transform="translate(418, 0)">
        <rect width="82" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <circle cx="14" cy="14" r="3.5" fill="#eab308" />
        <text x="26" y="18" class="font-mono" font-size="11" font-weight="600" fill="#cbd5e1">TS / JS</text>
      </g>
      <!-- C++ -->
      <g transform="translate(510, 0)">
        <rect width="66" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <circle cx="14" cy="14" r="3.5" fill="#60a5fa" />
        <text x="25" y="18" class="font-mono" font-size="11" font-weight="600" fill="#cbd5e1">C/C++</text>
      </g>
      <!-- PHP -->
      <g transform="translate(586, 0)">
        <rect width="66" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <circle cx="14" cy="14" r="3.5" fill="#818cf8" />
        <text x="25" y="18" class="font-mono" font-size="11" font-weight="600" fill="#cbd5e1">PHP</text>
      </g>
    </g>

    <!-- Feature Highlights Metrics -->
    <g transform="translate(0, 252)">
      <g transform="translate(0, 0)">
        <text x="0" y="24" class="font-sans" font-size="28" font-weight="800" fill="#38bdf8">99.4%</text>
        <text x="0" y="44" class="font-sans" font-size="12" font-weight="500" fill="#64748b">Token Cost Cut</text>
      </g>
      <g transform="translate(145, 0)">
        <text x="0" y="24" class="font-sans" font-size="28" font-weight="800" fill="#22c55e">100%</text>
        <text x="0" y="44" class="font-sans" font-size="12" font-weight="500" fill="#64748b">Logic Parity</text>
      </g>
      <g transform="translate(275, 0)">
        <text x="0" y="24" class="font-sans" font-size="28" font-weight="800" fill="#c084fc">0.0s</text>
        <text x="0" y="44" class="font-sans" font-size="12" font-weight="500" fill="#64748b">Hallucination Risk</text>
      </g>
      <g transform="translate(435, 0)">
        <text x="0" y="24" class="font-sans" font-size="28" font-weight="800" fill="#f59e0b">Zero</text>
        <text x="0" y="44" class="font-sans" font-size="12" font-weight="500" fill="#64748b">Dependencies</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT VISUAL: SURGICAL SLICE DIAGRAM ================= -->
  <g transform="translate(790, 60)" filter="url(#softShadow)">
    <!-- Monolith File (Before) -->
    <g transform="translate(0, 20)">
      <rect width="180" height="280" rx="10" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.8" />
      <!-- Window controls -->
      <circle cx="20" cy="20" r="4.5" fill="#ef4444" />
      <circle cx="34" cy="20" r="4.5" fill="#f59e0b" />
      <circle cx="48" cy="20" r="4.5" fill="#22c55e" />
      <text x="20" y="48" class="font-mono" font-size="11" font-weight="700" fill="#f87171">Monolith.ext</text>
      <text x="20" y="65" class="font-mono" font-size="9" fill="#64748b">3,850 LOC (Single File)</text>

      <!-- Code lines representation -->
      <rect x="20" y="85" width="120" height="6" rx="3" fill="#334155" />
      <rect x="20" y="98" width="80" height="6" rx="3" fill="#334155" />
      
      <!-- Slice Zone A (Cyan) -->
      <rect x="15" y="115" width="150" height="42" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-dasharray="3 3" />
      <text x="22" y="132" class="font-mono" font-size="9" fill="#38bdf8">Lines 420-950</text>
      <rect x="22" y="142" width="100" height="5" rx="2" fill="#06b6d4" fill-opacity="0.5" />

      <rect x="20" y="170" width="90" height="6" rx="3" fill="#334155" />

      <!-- Slice Zone B (Violet) -->
      <rect x="15" y="188" width="150" height="42" rx="4" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-dasharray="3 3" />
      <text x="22" y="205" class="font-mono" font-size="9" fill="#c084fc">Lines 1800-2400</text>
      <rect x="22" y="215" width="110" height="5" rx="2" fill="#a855f7" fill-opacity="0.5" />

      <rect x="20" y="244" width="130" height="6" rx="3" fill="#334155" />
      <rect x="20" y="258" width="70" height="6" rx="3" fill="#334155" />
    </g>

    <!-- Laser Cutting Beam In The Middle -->
    <path d="M 195 136 L 245 80" stroke="url(#sliceLaser)" stroke-width="2.5" filter="url(#laserGlow)" />
    <polygon points="248,77 245,86 238,82" fill="#22d3ee" />

    <path d="M 195 209 L 245 220" stroke="url(#sliceLaser)" stroke-width="2.5" filter="url(#laserGlow)" />
    <polygon points="248,220 240,215 240,225" fill="#a855f7" />

    <!-- Modular Split Files (After) -->
    <!-- Module 1 -->
    <g transform="translate(255, 30)">
      <rect width="165" height="110" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="16" cy="16" r="3.5" fill="#38bdf8" />
      <text x="28" y="20" class="font-mono" font-size="10" font-weight="700" fill="#38bdf8">ModuleScan</text>
      <text x="16" y="38" class="font-mono" font-size="8" fill="#64748b">530 LOC · Clean Seam</text>
      <rect x="16" y="52" width="125" height="4" rx="2" fill="#38bdf8" fill-opacity="0.5" />
      <rect x="16" y="62" width="105" height="4" rx="2" fill="#334155" />
      <rect x="16" y="72" width="85" height="4" rx="2" fill="#334155" />
      <rect x="16" y="85" width="60" height="14" rx="3" fill="#0284c7" fill-opacity="0.2" />
      <text x="22" y="95" class="font-mono" font-size="8" fill="#38bdf8">VALID_SYNTAX</text>
    </g>

    <!-- Module 2 -->
    <g transform="translate(255, 175)">
      <rect width="165" height="110" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.5" />
      <circle cx="16" cy="16" r="3.5" fill="#c084fc" />
      <text x="28" y="20" class="font-mono" font-size="10" font-weight="700" fill="#c084fc">ModuleExport</text>
      <text x="16" y="38" class="font-mono" font-size="8" fill="#64748b">600 LOC · 0 Token Rewrite</text>
      <rect x="16" y="52" width="130" height="4" rx="2" fill="#c084fc" fill-opacity="0.5" />
      <rect x="16" y="62" width="95" height="4" rx="2" fill="#334155" />
      <rect x="16" y="72" width="115" height="4" rx="2" fill="#334155" />
      <rect x="16" y="85" width="75" height="14" rx="3" fill="#7c3aed" fill-opacity="0.2" />
      <text x="22" y="95" class="font-mono" font-size="8" fill="#c084fc">4-AXIS PARITY ✓</text>
    </g>
  </g>
</svg>
