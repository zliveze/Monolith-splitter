<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="benchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="badCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1215" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#180c0e" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="goodCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c2528" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#091b1f" stop-opacity="0.9" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="redBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <linearGradient id="greenBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Base Canvas -->
  <rect width="1180" height="540" rx="16" fill="url(#benchBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Grid overlay -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <pattern id="bgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" />
    </pattern>
    <rect width="1180" height="540" fill="url(#bgrid)" />
  </g>

  <!-- Header Title -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" class="font-sans" font-size="28" font-weight="800" fill="#f8fafc">
      Real-World Performance Benchmark
    </text>
    <text x="0" y="24" class="font-sans" font-size="14" fill="#94a3b8">
      Slicing a 3,850-line Monolithic Controller into 4 Modular Seams (Measured on Intel Core i7, 32GB RAM)
    </text>
  </g>

  <!-- ================= LEFT CARD: TRADITIONAL AI REWRITE ================= -->
  <g transform="translate(60, 100)" filter="url(#cardShadow)">
    <rect width="510" height="390" rx="12" fill="url(#badCardBg)" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.6" />
    
    <!-- Card Header -->
    <g transform="translate(25, 30)">
      <rect width="90" height="22" rx="4" fill="#ef4444" fill-opacity="0.2" />
      <text x="8" y="15" class="font-mono" font-size="10" font-weight="700" fill="#f87171">TRADITIONAL</text>
      <text x="0" y="44" class="font-sans" font-size="18" font-weight="700" fill="#fca5a5">AI Full-File Rewrite Trap</text>
      <text x="0" y="62" class="font-sans" font-size="12" fill="#94a3b8">LLM regenerates entire files from prompt context</text>
    </g>

    <!-- Metric 1: Tokens -->
    <g transform="translate(25, 120)">
      <text x="0" y="0" class="font-sans" font-size="13" font-weight="600" fill="#cbd5e1">LLM Token Burn</text>
      <text x="460" y="0" class="font-mono" font-size="13" font-weight="700" fill="#f87171" text-anchor="end">~142,500 tokens</text>
      <!-- Background Bar -->
      <rect x="0" y="10" width="460" height="10" rx="5" fill="#334155" />
      <!-- Fill Bar (100%) -->
      <rect x="0" y="10" width="460" height="10" rx="5" fill="url(#redBar)" />
    </g>

    <!-- Metric 2: Duration -->
    <g transform="translate(25, 175)">
      <text x="0" y="0" class="font-sans" font-size="13" font-weight="600" fill="#cbd5e1">Refactor Latency</text>
      <text x="460" y="0" class="font-mono" font-size="13" font-weight="700" fill="#f87171" text-anchor="end">~210 seconds (3.5m)</text>
      <!-- Background Bar -->
      <rect x="0" y="10" width="460" height="10" rx="5" fill="#334155" />
      <!-- Fill Bar (95%) -->
      <rect x="0" y="10" width="435" height="10" rx="5" fill="url(#redBar)" />
    </g>

    <!-- Metric 3: Logic Parity -->
    <g transform="translate(25, 230)">
      <text x="0" y="0" class="font-sans" font-size="13" font-weight="600" fill="#cbd5e1">Function Parity Preservation</text>
      <text x="460" y="0" class="font-mono" font-size="13" font-weight="700" fill="#fca5a5" text-anchor="end">~65% (Bugs / Omissions)</text>
      <!-- Background Bar -->
      <rect x="0" y="10" width="460" height="10" rx="5" fill="#334155" />
      <!-- Fill Bar (65%) -->
      <rect x="0" y="10" width="300" height="10" rx="5" fill="#f59e0b" />
    </g>

    <!-- Verdict Flaws -->
    <g transform="translate(25, 290)">
      <text x="0" y="0" class="font-sans" font-size="12" font-weight="700" fill="#f87171">KEY FAILURE MODES:</text>
      <text x="0" y="20" class="font-mono" font-size="11" fill="#fca5a5">✖ Dropped callbacks &amp; omitted helper functions</text>
      <text x="0" y="38" class="font-mono" font-size="11" fill="#fca5a5">✖ Orphan `this` / undefined member call crashes</text>
      <text x="0" y="56" class="font-mono" font-size="11" fill="#fca5a5">✖ Costly API token exhaustion &amp; rate-limit stall</text>
    </g>
  </g>

  <!-- ================= RIGHT CARD: MONOLITH SPLITTER ================= -->
  <g transform="translate(610, 100)" filter="url(#cardShadow)">
    <rect width="510" height="390" rx="12" fill="url(#goodCardBg)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8" />
    
    <!-- Card Header -->
    <g transform="translate(25, 30)">
      <rect width="110" height="22" rx="4" fill="#10b981" fill-opacity="0.2" />
      <text x="8" y="15" class="font-mono" font-size="10" font-weight="700" fill="#34d399">VERBATIM AST</text>
      <text x="0" y="44" class="font-sans" font-size="18" font-weight="700" fill="#6ee7b7">Monolith Splitter v2.1</text>
      <text x="0" y="62" class="font-sans" font-size="12" fill="#94a3b8">Multi-Range byte slicing + Language Seam delegation</text>
    </g>

    <!-- Metric 1: Tokens -->
    <g transform="translate(25, 120)">
      <text x="0" y="0" class="font-sans" font-size="13" font-weight="600" fill="#cbd5e1">LLM Token Burn</text>
      <text x="460" y="0" class="font-mono" font-size="13" font-weight="700" fill="#34d399" text-anchor="end">850 tokens (-99.4%)</text>
      <!-- Background Bar -->
      <rect x="0" y="10" width="460" height="10" rx="5" fill="#334155" />
      <!-- Fill Bar (0.6% -> small pip) -->
      <rect x="0" y="10" width="12" height="10" rx="5" fill="url(#greenBar)" />
    </g>

    <!-- Metric 2: Duration -->
    <g transform="translate(25, 175)">
      <text x="0" y="0" class="font-sans" font-size="13" font-weight="600" fill="#cbd5e1">Refactor Latency</text>
      <text x="460" y="0" class="font-mono" font-size="13" font-weight="700" fill="#34d399" text-anchor="end">2.1 seconds (-98.8%)</text>
      <!-- Background Bar -->
      <rect x="0" y="10" width="460" height="10" rx="5" fill="#334155" />
      <!-- Fill Bar (2.1s -> small pip) -->
      <rect x="0" y="10" width="18" height="10" rx="5" fill="url(#greenBar)" />
    </g>

    <!-- Metric 3: Logic Parity -->
    <g transform="translate(25, 230)">
      <text x="0" y="0" class="font-sans" font-size="13" font-weight="600" fill="#cbd5e1">Function Parity Preservation</text>
      <text x="460" y="0" class="font-mono" font-size="13" font-weight="700" fill="#34d399" text-anchor="end">100.0% (Zero Hallucination)</text>
      <!-- Background Bar -->
      <rect x="0" y="10" width="460" height="10" rx="5" fill="#334155" />
      <!-- Fill Bar (100%) -->
      <rect x="0" y="10" width="460" height="10" rx="5" fill="url(#cyanBar)" />
    </g>

    <!-- Verdict Flaws -->
    <g transform="translate(25, 290)">
      <text x="0" y="0" class="font-sans" font-size="12" font-weight="700" fill="#34d399">PRODUCTION GUARANTEES:</text>
      <text x="0" y="20" class="font-mono" font-size="11" fill="#a7f3d0">✔ Exact verbatim byte slicing directly on disk</text>
      <text x="0" y="38" class="font-mono" font-size="11" fill="#a7f3d0">✔ Transparent Proxy / Partial Class eliminates Orphan this</text>
      <text x="0" y="56" class="font-mono" font-size="11" fill="#a7f3d0">✔ 4-Axis Parity Gate verifies Symbols, IDs, Events &amp; Calls</text>
    </g>
  </g>
</svg>
